<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Stock Assistant</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --green: #0f9f6e;
      --red: #d93025;
      --yellow: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #ffffff 0, var(--bg) 48%, #eef2f7 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1120px; margin: 0 auto; padding: 48px 20px; }
    .hero { display: flex; justify-content: space-between; gap: 32px; align-items: flex-end; margin-bottom: 28px; }
    h1 { font-size: 44px; line-height: 1.08; letter-spacing: -1.5px; margin: 0 0 12px; }
    .sub { color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 700px; }
    .search { display: flex; gap: 12px; background: rgba(255,255,255,.78); border: 1px solid var(--border); padding: 10px; border-radius: 20px; box-shadow: 0 20px 60px rgba(15, 23, 42, .08); }
    input { width: 220px; border: 0; outline: none; padding: 12px 14px; font-size: 16px; background: transparent; }
    button { border: 0; padding: 12px 20px; border-radius: 14px; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
    .card { background: rgba(255,255,255,.88); backdrop-filter: blur(20px); border: 1px solid rgba(229,231,235,.9); border-radius: 26px; padding: 24px; box-shadow: 0 18px 50px rgba(15, 23, 42, .06); }
    .card h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.3px; }
    .score-row { display: flex; align-items: end; gap: 14px; }
    .score { font-size: 58px; line-height: .9; font-weight: 850; letter-spacing: -2px; }
    .score-label { color: var(--muted); margin-bottom: 4px; }
    .status { display: inline-flex; margin-top: 16px; padding: 8px 12px; border-radius: 999px; background: #f3f4f6; font-weight: 700; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
    .metric { border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 6px; font-weight: 800; font-size: 18px; }
    .section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .section-title { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    ul { padding-left: 20px; line-height: 1.8; margin: 8px 0 0; }
    .warning li { color: #8a4b08; }
    .empty { color: var(--muted); text-align: center; padding: 80px 20px; background: rgba(255,255,255,.72); border: 1px solid var(--border); border-radius: 26px; }
    .error { color: var(--red); background: #fff5f5; border: 1px solid #ffdada; padding: 14px; border-radius: 16px; display: none; margin-bottom: 16px; line-height: 1.7; }
    .disclaimer { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 20px; }
    .tiny { color: var(--muted); font-size: 12px; margin-top: 10px; }
    @media (max-width: 860px) {
      .hero, .grid { display: block; }
      .search { margin-top: 20px; }
      .card { margin-bottom: 16px; }
      .meta { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 34px; }
      .search { width: 100%; }
      input { flex: 1; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="hero">
      <div>
        <h1>AI Stock Assistant</h1>
        <div class="sub">输入 A 股代码，系统会基于近期 K 线、均线、RSI、MACD 和量能变化，输出一个可读的交易辅助判断。</div>
        <div class="tiny">纯前端版本：无需安装、无需启动后端，打开网页即可使用。</div>
      </div>
      <div class="search">
        <input id="symbol" value="600519" placeholder="例如 600519" maxlength="6" />
        <button id="btn" onclick="analyze()">分析</button>
      </div>
    </div>

    <div id="error" class="error"></div>
    <div id="result" class="empty">输入股票代码后点击分析。</div>

    <div class="disclaimer">免责声明：本工具仅用于个人研究与交易辅助，不构成任何证券投资建议。市场有风险，交易需谨慎。</div>
  </main>

  <script>
    const PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`
    ];

    function normalizeSymbol(symbol) {
      const code = symbol.trim().replace(/[^0-9]/g, '');
      if (!/^\d{6}$/.test(code)) throw new Error('请输入 6 位 A 股代码，例如 600519、000001、300750');
      return code;
    }

    function secidFromCode(code) {
      if (code.startsWith('6') || code.startsWith('9')) return `1.${code}`;
      return `0.${code}`;
    }

    async function fetchText(url) {
      let lastError = null;
      for (const proxy of PROXIES) {
        try {
          const res = await fetch(proxy(url), { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          if (text && text.length > 20) return text;
        } catch (e) { lastError = e; }
      }
      throw new Error('行情数据获取失败，可能是公开接口或跨域代理暂时不可用。' + (lastError ? ` ${lastError.message}` : ''));
    }

    async function fetchDaily(code) {
      const secid = secidFromCode(code);
      const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&end=20500101&lmt=180`;
      const text = await fetchText(url);
      const json = JSON.parse(text);
      if (!json.data || !json.data.klines || !json.data.klines.length) throw new Error('没有获取到行情数据，请确认股票代码是否正确。');
      return json.data.klines.map(line => {
        const p = line.split(',');
        return {
          date: p[0],
          open: Number(p[1]),
          close: Number(p[2]),
          high: Number(p[3]),
          low: Number(p[4]),
          volume: Number(p[5]),
          amount: Number(p[6]),
          pct: Number(p[8]),
          turnover: Number(p[10])
        };
      }).filter(x => Number.isFinite(x.close));
    }

    function sma(arr, index, n, key) {
      if (index + 1 < n) return null;
      let sum = 0;
      for (let i = index - n + 1; i <= index; i++) sum += arr[i][key];
      return sum / n;
    }

    function ema(values, n) {
      const k = 2 / (n + 1);
      const out = [];
      values.forEach((v, i) => out.push(i === 0 ? v : v * k + out[i - 1] * (1 - k)));
      return out;
    }

    function addIndicators(data) {
      const closes = data.map(d => d.close);
      const ema12 = ema(closes, 12);
      const ema26 = ema(closes, 26);
      const dif = closes.map((_, i) => ema12[i] - ema26[i]);
      const dea = ema(dif, 9);
      return data.map((d, i) => {
        let gain = 0, loss = 0;
        if (i >= 14) {
          for (let j = i - 13; j <= i; j++) {
            const delta = data[j].close - data[j - 1].close;
            if (delta >= 0) gain += delta; else loss -= delta;
          }
        }
        const avgGain = i >= 14 ? gain / 14 : null;
        const avgLoss = i >= 14 ? loss / 14 : null;
        const rs = avgLoss === 0 ? null : avgGain / avgLoss;
        return {
          ...d,
          ma5: sma(data, i, 5, 'close'),
          ma10: sma(data, i, 10, 'close'),
          ma20: sma(data, i, 20, 'close'),
          ma60: sma(data, i, 60, 'close'),
          volMa5: sma(data, i, 5, 'volume'),
          rsi14: rs === null ? 100 : 100 - 100 / (1 + rs),
          macdHist: (dif[i] - dea[i]) * 2
        };
      }).map(d => ({ ...d, volRatio: d.volMa5 ? d.volume / d.volMa5 : null }));
    }

    function analyzeSignal(data) {
      const latest = data[data.length - 1];
      const prev = data[data.length - 2];
      let score = 50;
      const reasons = [];
      const warnings = [];
      let trend = '震荡状态：均线结构尚不清晰';
      let volume = '量能数据不足';

      const { close, ma5, ma10, ma20, ma60, rsi14, macdHist, volRatio, pct } = latest;

      if (close > ma5 && ma5 > ma10 && ma10 > ma20 && ma20 > ma60) {
        score += 25;
        trend = '强趋势：价格位于多条均线上方，均线多头排列';
        reasons.push('股价站上 MA5/MA10/MA20/MA60，短中期趋势较强');
      } else if (close > ma20 && ma20 > ma60) {
        score += 15;
        trend = '趋势偏强：价格位于 20 日线之上，中期结构较好';
        reasons.push('股价站上 MA20，趋势尚未破坏');
      } else if (close < ma20) {
        score -= 15;
        trend = '趋势转弱：价格跌破 20 日线';
        warnings.push('股价跌破 MA20，需要警惕趋势走弱');
      }

      if (volRatio !== null) {
        if (volRatio >= 1.8 && pct > 0) {
          score += 15;
          volume = '放量上涨：资金关注度明显提升';
          reasons.push('成交量明显高于 5 日均量，并伴随上涨');
        } else if (volRatio >= 1.8 && pct < 0) {
          score -= 15;
          volume = '放量下跌：短线抛压较重';
          warnings.push('放量下跌，可能存在资金流出或情绪转弱');
        } else if (volRatio < 0.7) {
          score -= 5;
          volume = '缩量：资金参与度一般';
          warnings.push('当前量能不足，突破有效性需要观察');
        } else {
          volume = '量能正常：成交量未出现极端变化';
        }
      }

      if (macdHist > 0 && macdHist > prev.macdHist) {
        score += 10;
        reasons.push('MACD 柱体扩大，短线动能增强');
      } else if (macdHist < 0 && macdHist < prev.macdHist) {
        score -= 10;
        warnings.push('MACD 负柱扩大，短线动能偏弱');
      }

      if (rsi14 >= 80) {
        score -= 15;
        warnings.push('RSI 高于 80，短线过热，追高风险较大');
      } else if (rsi14 >= 70) {
        score -= 8;
        warnings.push('RSI 高于 70，短线偏热');
      } else if (rsi14 <= 30) {
        score -= 5;
        warnings.push('RSI 低于 30，虽然超卖，但趋势可能仍弱');
      } else if (rsi14 >= 45 && rsi14 <= 65) {
        score += 5;
        reasons.push('RSI 处于相对健康区间，未明显过热');
      }

      if (pct >= 7) {
        score -= 8;
        warnings.push('单日涨幅较大，不建议情绪化追高');
      } else if (pct <= -5) {
        score -= 8;
        warnings.push('单日跌幅较大，需等待企稳信号');
      }

      score = Math.max(0, Math.min(100, Math.round(score)));
      let status, action, risk;
      if (score >= 80) {
        status = '强观察 / 可轻仓试错';
        action = '趋势和动能较好，但仍建议控制仓位，优先等待回踩确认，不建议满仓追高。';
        risk = '中';
      } else if (score >= 65) {
        status = '观察 / 不追高';
        action = '可以加入重点观察池，等待回踩均线或突破确认后再考虑。';
        risk = '中';
      } else if (score >= 50) {
        status = '持有为主';
        action = '如果已经持有，可继续观察趋势是否守住 MA20；如果未持有，不建议急于买入。';
        risk = '中等偏高';
      } else if (score >= 35) {
        status = '减仓 / 谨慎';
        action = '趋势或量能存在问题，建议降低仓位，等待重新站回关键均线。';
        risk = '高';
      } else {
        status = '止损 / 回避';
        action = '当前风险较高，建议回避或严格执行止损，等待新的趋势信号。';
        risk = '高';
      }

      if (!reasons.length) reasons.push('暂未出现明显正向信号，建议继续观察');
      if (!warnings.length) warnings.push('暂未发现极端风险，但仍需控制仓位和止损');

      return {
        score,
        status,
        trend,
        volume,
        risk,
        summary: `综合评分 ${score}/100，当前建议为：${status}。${trend}；${volume}。`,
        action,
        buyZone: `参考 MA5 ${format(ma5)} 与 MA10 ${format(ma10)} 附近的承接情况`,
        stopLoss: `重点观察 MA20 ${format(ma20)}，有效跌破则风险提升`,
        takeProfit: '短线可按 8%-15% 收益或前高压力位分批止盈',
        reasons,
        warnings
      };
    }

    function format(v, digits = 2) {
      return v === null || !Number.isFinite(v) ? '-' : Number(v).toFixed(digits);
    }

    function metric(label, value) {
      return `<div class="metric"><div class="label">${label}</div><div class="value">${value ?? '-'}</div></div>`;
    }

    function list(items) {
      return `<ul>${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
    }

    async function analyze() {
      const btn = document.getElementById('btn');
      const error = document.getElementById('error');
      const result = document.getElementById('result');
      error.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '分析中...';
      result.className = 'empty';
      result.innerHTML = '正在获取行情并计算指标...';

      try {
        const code = normalizeSymbol(document.getElementById('symbol').value);
        const raw = await fetchDaily(code);
        if (raw.length < 60) throw new Error('行情数据不足 60 个交易日，暂无法分析。');
        const data = addIndicators(raw);
        const latest = data[data.length - 1];
        const a = analyzeSignal(data);

        result.className = 'grid';
        result.innerHTML = `
          <section class="card">
            <h2>${code} · ${latest.date}</h2>
            <div class="score-row"><div class="score">${a.score}</div><div class="score-label">/ 100</div></div>
            <div class="status">${a.status}</div>
            <div class="section">
              <div class="section-title">综合判断</div>
              <div>${a.summary}</div>
            </div>
            <div class="meta">
              ${metric('收盘价', format(latest.close))}
              ${metric('涨跌幅', format(latest.pct) + '%')}
              ${metric('风险等级', a.risk)}
              ${metric('RSI14', format(latest.rsi14))}
              ${metric('量比', format(latest.volRatio))}
              ${metric('MACD柱', format(latest.macdHist, 4))}
            </div>
            <div class="section">
              <div class="section-title">操作建议</div>
              <div>${a.action}</div>
            </div>
            <div class="section">
              <div class="section-title">关键价位</div>
              <div>买入观察：${a.buyZone}</div>
              <div style="margin-top:8px;">止损观察：${a.stopLoss}</div>
              <div style="margin-top:8px;">止盈思路：${a.takeProfit}</div>
            </div>
          </section>
          <aside class="card">
            <h2>信号拆解</h2>
            <div class="section">
              <div class="section-title">正向因素</div>
              ${list(a.reasons)}
            </div>
            <div class="section warning">
              <div class="section-title">风险提示</div>
              ${list(a.warnings)}
            </div>
            <div class="section">
              <div class="section-title">均线</div>
              <div>MA5：${format(latest.ma5)} ｜ MA10：${format(latest.ma10)}</div>
              <div style="margin-top:8px;">MA20：${format(latest.ma20)} ｜ MA60：${format(latest.ma60)}</div>
            </div>
          </aside>
        `;
      } catch (e) {
        error.style.display = 'block';
        error.textContent = '分析失败：' + e.message;
        result.className = 'empty';
        result.innerHTML = '可以稍后重试，或换一个股票代码。公开行情接口偶尔会有跨域/限流问题。';
      } finally {
        btn.disabled = false;
        btn.textContent = '分析';
      }
    }
  </script>
</body>
</html>
